# CD pipeline — builds the Docker image on release or main push.
#
# Triggers:
#   - Push to main
#   - Semantic version tags (v1.2.3)
#
# The image is built and verified but NOT pushed to any registry.
# To enable pushing, set `push: true` and configure registry credentials.

name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Build Docker image (no push)
  # ──────────────────────────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: media-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
