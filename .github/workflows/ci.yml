# CI pipeline — runs on every push and pull request.
#
# Jobs:
#   1. lint:    go vet + staticcheck
#   2. test:    unit tests (fast, no Docker needed)
#   3. e2e:     end-to-end tests with testcontainers (PostgreSQL + MinIO)
#   4. build:   compile the binary to verify no build errors
#
# Design decisions:
#   - Unit tests and lint run in parallel for fast feedback.
#   - E2E tests run separately because they need Docker (DinD).
#   - Go module cache is shared across jobs for speed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.25.0"

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: staticcheck ./...

  # ──────────────────────────────────────────────
  # Job 2: Unit tests (fast, no Docker)
  # ──────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run unit tests
        run: go test -race -count=1 -short -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 3: E2E tests (needs Docker for testcontainers)
  # ──────────────────────────────────────────────
  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # testcontainers-go uses the Docker socket directly.
      # GitHub Actions runners already have Docker installed.
      - name: Run E2E tests
        run: go test -race -count=1 -v -timeout 10m ./internal/e2e/

  # ──────────────────────────────────────────────
  # Job 4: Build binary
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: go build -o bin/media-api ./cmd/api/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: media-api-binary
          path: bin/media-api
          retention-days: 7
